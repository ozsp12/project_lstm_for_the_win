name: Advance continual-learning data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versioned-data-writer
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "42"
      TF_DETERMINISTIC_OPS: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      CUDA_VISIBLE_DEVICES: "-1"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check

      - name: Capture current generation
        run: |
          DATA_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "DATA_TIMESTAMP=$DATA_TIMESTAMP" >> "$GITHUB_ENV"
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root = Path("data/input")
          manifest = json.loads((root / "input_manifest.json").read_text(encoding="utf-8"))
          with (root / "train.csv").open(encoding="utf-8", newline="") as handle:
              train = list(csv.DictReader(handle))
          state = {
              "generation": manifest["generation"],
              "train_rows": len(train),
              "incoming_sha256": hashlib.sha256((root / "incoming.csv").read_bytes()).hexdigest(),
          }
          Path("/tmp/pre_advance.json").write_text(json.dumps(state), encoding="utf-8")
          print(state)
          PY

      - name: Advance input state only
        run: >-
          python -m lstm_for_the_win.handler generate-data
          --mode advance
          --data-timestamp "$DATA_TIMESTAMP"

      - name: Validate incremental transition
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root = Path("data/input")
          before = json.loads(Path("/tmp/pre_advance.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "input_manifest.json").read_text(encoding="utf-8"))
          with (root / "train.csv").open(encoding="utf-8", newline="") as handle:
              train = list(csv.DictReader(handle))
          with (root / "incoming.csv").open(encoding="utf-8", newline="") as handle:
              incoming = list(csv.DictReader(handle))
          assert manifest["generation"] == before["generation"] + 1
          assert len(train) > before["train_rows"]
          assert hashlib.sha256((root / "incoming.csv").read_bytes()).hexdigest() != before["incoming_sha256"]
          assert all(row.get("template_family") for row in train)
          assert all(row.get("template_family") for row in incoming)
          assert manifest["template_family_metadata"]["origin"] == "generated_at_render_time"
          PY

      - name: Commit data transition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/input
          git commit -m "data: advance continual-learning generation"
          git push origin HEAD:main
